name: Reliable Credit Risk MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_validate:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Validation & Model Training
        run: |
          python scripts/train_pipeline.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Run Failure & Recovery Smoke Tests
        run: |
          python scripts/demo_failures.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reliable-credit-risk-api:latest
