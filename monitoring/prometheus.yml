global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "credit-risk-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "localhost:8000", "host.docker.internal:8000"]
        labels:
          environment: "production"
          service: "credit-risk-mlops"
